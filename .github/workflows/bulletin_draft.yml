name: Generate Weekly Bulletin Draft

on:
  schedule:
    # Run every Saturday at 16:00 UTC (9:00 AM PDT)
    - cron: '0 16 * * 6'
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions tab

jobs:
  generate_draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 pdfplumber

      - name: Run Scraper & Draft Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/automate_bulletin.py

      - name: Commit and Push Draft
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add drafts/*.md
          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No new draft changes to commit."
          else
            git commit -m "Automated update: Add weekly translation draft"
            git push
          fi
